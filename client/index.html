<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF9" id="meta-theme-light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1917" id="meta-theme-dark" />
    <meta name="description" content="Direct peer-to-peer file transfer in your browser. Nothing stored on our server." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pelican</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('pelican_theme');
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
